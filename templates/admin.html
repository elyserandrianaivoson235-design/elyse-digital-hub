<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <title>Backend Admin</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        table { width: 95%; margin: 20px auto; border-collapse: collapse; background: rgba(0,0,0,0.5); }
        th, td { border: 1px solid #00f2ff; padding: 12px; color: white; text-align: left; font-size: 0.9em; }
        th { background: #00f2ff; color: black; text-transform: uppercase; }
        
        .action-cell {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-reply {
            color: #00f2ff;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #00f2ff;
            padding: 5px 10px;
            border-radius: 4px;
            transition: 0.3s;
            font-size: 0.9em;
        }
        .btn-reply:hover {
            background: #00f2ff;
            color: black;
        }

        .btn-delete {
            color: #ff4b4b;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #ff4b4b;
            padding: 5px 10px;
            border-radius: 4px;
            transition: 0.3s;
        }
        .btn-delete:hover {
            background: #ff4b4b;
            color: white;
        }

        .logout-link {
            color: #ff4b4b;
            float: right;
            margin-right: 2.5%;
            text-decoration: none;
            border: 1px solid #ff4b4b;
            padding: 5px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .logout-link:hover {
            background: #ff4b4b;
            color: white;
        }

        .date-col { color: #00f2ff; font-weight: bold; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body class="content">
    <a href="/logout" class="logout-link">Hivoaka (Logout)</a>

    <h1>Lisitry ny Hafatra voaray (Backend View)</h1>
    
    <table>
        <tr>
            <th>Daty & Ora</th> 
            <th>Anarana</th>
            <th>Email</th>
            <th>Hafatra</th>
            <th>Action</th> 
        </tr>
        {% for h in hafatra_rehetra %}
        <tr>
            <td class="date-col">{{ h.daty if h.daty else '---' }}</td>
            <td>{{ h.anarana }}</td>
            <td>{{ h.email }}</td>
            <td>{{ h.hafatra }}</td>
            <td class="action-cell">
                <a href="mailto:{{ h.email }}?subject=Réponse à votre message sur Elysé Digital Hub" class="btn-reply">
                    Valiana
                </a>

                <a href="/hamafa/{{ h.id }}" class="btn-delete" onclick="return confirm('Tena hofafana ve ity hafatra ity?')">
                    Hamafa
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
    
    <br>
    <a href="/" class="menu-link">Hiverina amin'ny Fandraisana</a>
</body>
</html>
