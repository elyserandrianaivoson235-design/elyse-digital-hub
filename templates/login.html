<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-box { 
            width: 350px; 
            margin: 100px auto; 
            padding: 30px; 
            background: rgba(0, 0, 0, 0.8); 
            border: 2px solid #00f2ff; 
            border-radius: 15px; 
            text-align: center;
            box-shadow: 0 0 20px #00f2ff;
        }
        h2 { color: #00f2ff; margin-bottom: 20px; }
        input { 
            width: 90%; 
            padding: 12px; 
            margin: 10px 0; 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid #00f2ff; 
            color: white; 
            border-radius: 5px;
        }
        button { 
            background: #00f2ff; 
            color: black; 
            border: none; 
            padding: 12px 25px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover { background: #00d0db; }
        .error-msg { color: #ff4b4b; margin-bottom: 10px; font-size: 0.9em; }
    </style>
</head>
<body class="content">
    <div class="login-box">
        <h2>Admin Access</h2>
        
        {% if soso_kevitra %}
            <p class="error-msg">{{ soso_kevitra }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Anarana (Username)" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">HIDITRA</button>
        </form>
    </div>
</body>
</html>
